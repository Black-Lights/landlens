<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LandLens app icon">
  <!-- Solid indigo rounded square background; white strokes on top.
       Used as the source for PWA / app-store icons and the favicon raster. -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="#2563EB"/>
  <g transform="translate(96 96) scale(5)">
    <circle cx="32" cy="32" r="28" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
    <clipPath id="app-clip"><circle cx="32" cy="32" r="28"/></clipPath>
    <g clip-path="url(#app-clip)" stroke="#FFFFFF" fill="none">
      <path d="M 0 20 L 64 20" stroke-width="2"/>
      <path d="M 0 44 L 64 44" stroke-width="2"/>
      <path d="M 20 0 L 20 64" stroke-width="2"/>
      <path d="M 44 0 L 44 64" stroke-width="2"/>
      <rect x="20" y="20" width="24" height="24" fill="#FFFFFF" opacity="0.20" stroke="none"/>
      <rect x="20" y="20" width="24" height="24" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="32" cy="29" r="2.5" fill="#FFFFFF" stroke="none"/>
    </g>
  </g>
</svg>
