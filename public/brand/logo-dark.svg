<svg width="240" height="64" viewBox="0 0 240 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LandLens">
  <!-- For dark backgrounds — white strokes, indigo highlight stays brand-colored, wordmark white / muted. -->
  <g>
    <circle cx="32" cy="32" r="28" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
    <clipPath id="ll-dark-clip"><circle cx="32" cy="32" r="28"/></clipPath>
    <g clip-path="url(#ll-dark-clip)" fill="none">
      <path d="M 0 20 L 64 20" stroke="#FFFFFF" stroke-width="2"/>
      <path d="M 0 44 L 64 44" stroke="#FFFFFF" stroke-width="2"/>
      <path d="M 20 0 L 20 64" stroke="#FFFFFF" stroke-width="2"/>
      <path d="M 44 0 L 44 64" stroke="#FFFFFF" stroke-width="2"/>
      <rect x="20" y="20" width="24" height="24" fill="#3B82F6" opacity="0.28"/>
      <rect x="20" y="20" width="24" height="24" stroke="#60A5FA" stroke-width="2" fill="none"/>
      <circle cx="32" cy="29" r="2.5" fill="#60A5FA"/>
    </g>
  </g>
  <text x="74" y="42" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="500" fill="#FFFFFF" letter-spacing="-0.02em">Land<tspan font-weight="400" fill="#FFFFFF" opacity="0.55">Lens</tspan></text>
</svg>
