<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LandLens">
  <style>
    /* Attribute strokes default to white (visible on dark tabs and used by the
       .ico rasterizer, which doesn't evaluate media queries). On light-mode
       browsers, this media query swaps them back to slate-900. */
    @media (prefers-color-scheme: light) {
      .fg { stroke: #0F172A; }
    }
  </style>
  <circle class="fg" cx="32" cy="32" r="28" stroke="#FFFFFF" stroke-width="2.5" fill="none"/>
  <clipPath id="fav-clip"><circle cx="32" cy="32" r="28"/></clipPath>
  <g clip-path="url(#fav-clip)" fill="none">
    <path class="fg" d="M 0 20 L 64 20" stroke="#FFFFFF" stroke-width="2"/>
    <path class="fg" d="M 0 44 L 64 44" stroke="#FFFFFF" stroke-width="2"/>
    <path class="fg" d="M 20 0 L 20 64" stroke="#FFFFFF" stroke-width="2"/>
    <path class="fg" d="M 44 0 L 44 64" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="20" y="20" width="24" height="24" fill="#60A5FA" opacity="0.45" stroke="none"/>
    <rect x="20" y="20" width="24" height="24" stroke="#60A5FA" stroke-width="2.5"/>
    <circle cx="32" cy="29" r="3" fill="#60A5FA" stroke="none"/>
  </g>
</svg>
